<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded-square background: deep navy -->
  <rect width="512" height="512" rx="116" fill="#1E3A8A"/>

  <!-- Amber diagonal — drawn first, hidden behind the white bars -->
  <line x1="116" y1="82" x2="396" y2="430" stroke="#F59E0B" stroke-width="82" stroke-linecap="butt"/>

  <!-- White left vertical bar -->
  <line x1="116" y1="82" x2="116" y2="430" stroke="#FFFFFF" stroke-width="106" stroke-linecap="butt"/>

  <!-- White right vertical bar -->
  <line x1="396" y1="82" x2="396" y2="430" stroke="#FFFFFF" stroke-width="106" stroke-linecap="butt"/>
</svg>
